# Runs the check battery on every pull request and every push to main (.context/ci.md): for
# both packages type-check, lint, format check, tests with a coverage floor, the
# production build (the client's with its prerender) and a production-dependency audit; for
# the server also the migration check, and its coverage run includes the PostgreSQL
# integration tests against a throwaway pgvector database (ADR-0044). Production deploys come
# from here: on a push to main, the `deploy` job waits for `server` and `client` and then calls
# both Render services' deploy hooks for this exact commit (ADR-0054, .context/deployment.md).
# render.yaml sets `autoDeployTrigger: off`, so Render deploys nothing by itself.
# Keep it running on every push to main with no path filter: a commit without a run is never
# deployed. The job names `server` and `client` are the required checks of the
# GitHub ruleset `no-nonsense-main`: rename one only together with the ruleset.
# Secrets: only the `deploy` job uses any, the two hook URLs RENDER_DEPLOY_HOOK_API and
# RENDER_DEPLOY_HOOK_WEBSITE (repository secrets). Never echo them: the URL is the credential.
name: CI

on:
  # Pushes to other branches run only through their pull request, so a PR branch runs once
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request cancels its older run; runs on main are never cancelled,
# because a main commit deploys only from its own completed run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # The major version production and the Docker dev database run
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: actually_relevant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Nothing calls OpenAI in tests; the client libraries only want a key to exist
      OPENAI_API_KEY: sk-test-dummy
    steps:
      - uses: actions/checkout@v4
        with:
          # The migration check diffs against the base branch, so it needs the history
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefix server
      - name: Migration check
        # Base: the pull request's target; on main, the commit before the push; elsewhere main
        run: |
          if [ "$EVENT" = pull_request ]; then
            base="origin/$BASE_REF"
          elif [ "$REF" = refs/heads/main ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            base="$BEFORE"
          else
            base=origin/main
          fi
          npm run check:migrations --prefix server -- --base "$base"
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
      - name: Generate the Prisma client
        run: npm run db:generate --prefix server
        env:
          # prisma.config.ts requires a value; generate never connects to it
          DATABASE_URL: postgresql://unused:unused@localhost:5432/unused
      - run: npm run typecheck --prefix server
      - run: npm run lint --prefix server
      - run: npm run format:check --prefix server
      # One run of both vitest projects (unit and db), so the floor counts the db tests too
      - name: Unit and PostgreSQL tests with the coverage floor
        run: npm run test:coverage --prefix server
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/actually_relevant_test
      - name: Build (as Render does, minus the migrate step)
        run: npm run build --prefix server
      - name: Production dependency audit (high and above, minus audit-allowlist.json)
        run: npm run audit:prod --prefix server

  client:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: client/package-lock.json
      # puppeteer's Chrome for the prerender; npm ci skips the download when it is already here
      - name: Cache puppeteer's Chrome
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('client/package-lock.json') }}
      # Also installs puppeteer's Chrome (from the cache when it hit), which the prerender
      # launches with --no-sandbox (vite.config.ts), so Ubuntu's user-namespace restriction
      # does not stop it
      - run: npm ci --prefix client
      - run: npm run typecheck --prefix client
      - run: npm run lint --prefix client
      - run: npm run format:check --prefix client
      - name: Unit tests with the coverage floor
        run: npm run test:coverage --prefix client
      - name: Build with prerender
        run: npm run build --prefix client
      - name: Production dependency audit (high and above, minus audit-allowlist.json)
        run: npm run audit:prod --prefix client

  # Deploys both Render services once both checks are green, pinned to this run's commit with
  # the hook's `ref` parameter, so Render's own root-directory rule cannot skip a service
  # (ADR-0054). Not a required check. Runs one at a time; a run whose commit is no longer the
  # head of main deploys nothing, so an older run that finishes late cannot roll production back.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [server, client]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: render-deploy
      cancel-in-progress: false
    steps:
      - name: Trigger both Render deploys for this commit
        env:
          HOOK_API: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
          HOOK_WEBSITE: ${{ secrets.RENDER_DEPLOY_HOOK_WEBSITE }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        # Never `set -x` or echo a hook: the URL carries the key. Messages name the secret only.
        run: |
          missing=""
          [ -n "$HOOK_API" ] || missing="$missing RENDER_DEPLOY_HOOK_API"
          [ -n "$HOOK_WEBSITE" ] || missing="$missing RENDER_DEPLOY_HOOK_WEBSITE"
          if [ -n "$missing" ]; then
            echo "::error title=Render deploy hook secret missing::Not set:$missing. Nothing was deployed. Copy each URL from the Render service's Settings > Deploy Hook into Settings > Secrets and variables > Actions, then re-run this job (.context/deployment.md, CI gate)."
            exit 1
          fi

          head=$(gh api "repos/$REPO/commits/main" --jq .sha)
          if [ "$head" != "$SHA" ]; then
            echo "::notice title=Deploy skipped::main has moved on to $head; that commit's run deploys it, and it contains $SHA."
            exit 0
          fi

          failed=0
          for secret in RENDER_DEPLOY_HOOK_API RENDER_DEPLOY_HOOK_WEBSITE; do
            if [ "$secret" = RENDER_DEPLOY_HOOK_API ]; then hook=$HOOK_API; else hook=$HOOK_WEBSITE; fi
            case "$hook" in *\?*) sep='&' ;; *) sep='?' ;; esac
            status=$(curl --silent --output response.json --write-out '%{http_code}' --max-time 30 --request POST "${hook}${sep}ref=${SHA}") || status=000
            case "$status" in
              200) echo "$secret: deploy of $SHA started ($(grep -o 'dep-[a-z0-9]*' response.json | head -n 1 || true))" ;;
              202) echo "$secret: another deploy is running; Render queues $SHA after it" ;;
              *)
                case "$status" in
                  401|404) why="the hook URL is wrong or was regenerated, or Render cannot find the commit" ;;
                  409) why="the service is suspended or cannot be deployed" ;;
                  000) why="no answer from Render (network error or timeout)" ;;
                  *) why="unexpected answer" ;;
                esac
                echo "::error title=Render deploy failed::$secret answered HTTP $status: $why. That service was not deployed; re-run this job once fixed."
                failed=1
                ;;
            esac
          done
          rm -f response.json
          exit "$failed"
