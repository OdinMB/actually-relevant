# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
#
# Render blueprint for the backend web service and the static site (ADR-0036, ADR-0038).
#
# Runtimes: the backend is a native Node service (runtime: node), built from source with
# its own dependencies; the frontend is a Render static site (runtime: static) served
# from Render's CDN. This file owns the services' settings: names, region, plan, custom
# domains, commands, root directories, health check, rewrite order and the environment
# variables production sets. Service-level settings mirror Render's own export of the
# live services (2026-10-13), because on adoption Render overrides any setting the file
# leaves out with its default.
#
# Every variable is in exactly one of two modes:
# - a fixed `value:` for settings that are not secret and are the same on every host
#   (NODE_ENV, the measured TRUST_PROXY hop count, NODE_VERSION). A sync rewrites the
#   dashboard with it, so it must equal what production runs.
# - `sync: false` for secrets, canonical addresses (FRONTEND_URL, API_URL, VITE_API_URL),
#   switches, and values production sets that this file cannot see. Their values live
#   on each service's Environment page.
#
# Left out on purpose: the PostgreSQL database (ADR-0035) and any fromDatabase; every
# secret value; test-only and local-only variables (PORT, which Render sets, and
# SCHEDULER_ENABLED, for a second process only); tunables that run on their code
# default in server/src/config.ts; variables the code reads that production did not set
# as of 2026-10-13 (the blueprint test lists them with their reasons); and VITE_*
# variables on the backend.
#
# Render prompts for `sync: false` values only when the blueprint is first created. A
# variable added later is set by hand on the service's Environment page.
#
# NODE_VERSION must equal the repository's .node-version, on both services.
# server/src/blueprint.test.ts holds this file to the code, .node-version and both
# env.example files.
#
# Validate before pushing: render blueprints validate render.yaml
# Field reference: https://render.com/docs/blueprint-spec

services:
  # Backend: Express API, cron jobs and Prisma migrations.
  - type: web
    runtime: node
    name: actually-relevant-api
    # Fixed at creation; cannot change.
    region: frankfurt
    plan: starter
    rootDir: server
    # Production's command from the export, minus its leftover `prisma migrate resolve
    # --applied 20260209120000_add_feed_region` step, removed on purpose: the sync writes
    # this command over the dashboard's (.context/deployment.md).
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /health
    branch: main
    autoDeployTrigger: commit
    # Custom domains as in the dashboard (ADR-0038). The static site's rewrites target it.
    domains:
      - api.actuallyrelevant.news
    envVars:
      # Required
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: NODE_ENV
        value: production
      # Runtime: equal to .node-version (both services)
      - key: NODE_VERSION
        value: "22.22.0"
      # URLs
      - key: API_URL
        sync: false
      # Set to strict once VITE_API_URL points at api.actuallyrelevant.news (ADR-0019)
      - key: AUTH_COOKIE_SAMESITE
        sync: false
      # Newsletter (Plunk)
      - key: PLUNK_SECRET_KEY
        sync: false
      - key: PLUNK_PUBLIC_KEY
        sync: false
      - key: PLUNK_FROM_EMAIL
        sync: false
      - key: PLUNK_TEST_SEGMENT_ID
        sync: false
      # Newsletter signup (switch and Turnstile bot check)
      - key: SUBSCRIPTIONS_ENABLED
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      # Podcast (ElevenLabs voicing, Bunny audio hosting)
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: BUNNY_STORAGE_ZONE
        sync: false
      - key: BUNNY_STORAGE_PASSWORD
        sync: false
      # Content extraction
      - key: DIFFBOT_TOKEN
        sync: false
      - key: PIPFEED_API_KEY
        sync: false
      # Crawl concurrency: production sets both (code defaults 2 feeds, 1 article)
      - key: CONCURRENCY_CRAWL_FEEDS
        sync: false
      - key: CONCURRENCY_CRAWL_ARTICLES
        sync: false
      # Social posting
      - key: BLUESKY_HANDLE
        sync: false
      - key: BLUESKY_APP_PASSWORD
        sync: false
      - key: BLUESKY_AUTO_POST_ENABLED
        sync: false
      - key: MASTODON_URL
        sync: false
      - key: MASTODON_TOKEN
        sync: false
      - key: MASTODON_AUTO_POST_ENABLED
        sync: false
      # Measured on 2026-10-12 on both hostnames (.context/deployment.md, "Client IPs")
      - key: TRUST_PROXY
        value: "2"
      # Feedback form: HMAC key for the stored IP hash; unset refuses feedback (ADR-0037)
      - key: FEEDBACK_IP_HASH_SECRET
        sync: false

  # Frontend: React static site with prerendered public routes.
  - type: web
    runtime: static
    name: actually-relevant
    rootDir: client
    buildCommand: npm install && npm run build
    # Relative to rootDir (client/dist), as Render's export of the live service shows.
    staticPublishPath: dist
    branch: main
    autoDeployTrigger: commit
    # Custom domains as in the dashboard (ADR-0038); the onrender.com subdomain is off.
    domains:
      - actuallyrelevant.news
      - www.actuallyrelevant.news
    renderSubdomainPolicy: disabled
    # Order matters: Render applies the first matching rule, so /sitemap.xml and
    # /podcast.xml must stay above the SPA catch-all. No static sitemap.xml or
    # podcast.xml may exist in client/public/. Both rewrites target the API's custom
    # domain, not the onrender.com host (ADR-0019, .context/seo.md).
    routes:
      - type: rewrite
        source: /sitemap.xml
        destination: https://api.actuallyrelevant.news/api/sitemap.xml
      - type: rewrite
        source: /podcast.xml
        destination: https://api.actuallyrelevant.news/api/podcast/feed.xml
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22.22.0"
      - key: VITE_API_URL
        sync: false
      - key: VITE_TURNSTILE_SITE_KEY
        sync: false
